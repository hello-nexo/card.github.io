<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ключ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- СЦЕНА ---------- */
  .stage {
    position: fixed;
    inset: 0;
    background: #000;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    --bg: #000;
  }

  /* ---------- ПЛОСКОСТЬ ---------- */
  .ground {
    position: absolute;
    left: 0;
    height: 3px;
    border-radius: 3px;
    background: currentColor;
    transition: opacity .5s ease;
    will-change: opacity;
  }
  .ground.gone { opacity: 0; }

  /* ---------- ШАР ---------- */
  .ball {
    position: absolute;
    left: 0;
    top: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: currentColor;
    will-change: transform;
  }
  .ball::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 13%;
    width: 26%;
    height: 26%;
    margin-left: -13%;
    border-radius: 50%;
    background: var(--bg, #000);
  }

  /* ---------- ЩЕЛЬ ---------- */
  .slot {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: currentColor;
    opacity: 0;
    transition: opacity .7s ease;
    animation: slotPulse 2.6s ease-in-out infinite;
    will-change: transform, opacity;
  }
  .slot.show { opacity: .9; }

  @keyframes slotPulse {
    0%, 100% { transform: translate(-50%, -50%) scaleX(1); }
    50%      { transform: translate(-50%, -50%) scaleX(1.12); }
  }

  /* ---------- КЛЮЧ ---------- */
  .key {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    transition: opacity .8s ease;
    cursor: grab;
    touch-action: none;
    will-change: transform, opacity;
  }
  .key.show { opacity: 1; }
  .key.dragging { cursor: grabbing; }
  .key svg { display: block; width: 100%; height: 100%; }

  /* ---------- ПОДСКАЗКА ---------- */
  .hint {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    white-space: nowrap;
    color: currentColor;
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  /* ================================================================
     ПОРТАЛ
     ================================================================ */
  .portal {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .portal.on { opacity: 1; }

  .portal-core {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: #000;
    transform: translate(-50%, -50%);
    will-change: width, height;
    box-shadow: 0 0 0 1px rgba(0,0,0,.9);
  }

  .portal-ripple {
    position: absolute;
    left: -30px;
    top: -30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid #000;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }
  .portal.on .portal-ripple {
    animation: rippleOut 1.6s cubic-bezier(.2,.6,.3,1) infinite;
  }
  .portal.on .portal-ripple:nth-of-type(2) { animation-delay: .35s; }
  .portal.on .portal-ripple:nth-of-type(3) { animation-delay: .7s; }
  .portal.on .portal-ripple:nth-of-type(4) { animation-delay: 1.05s; }

  @keyframes rippleOut {
    0%   { transform: scale(.25); opacity: .75; border-width: 3px; }
    100% { transform: scale(7);   opacity: 0;   border-width: 1px; }
  }

  /* ---------- ФИНАЛЬНАЯ ТОЧКА ---------- */
  .final-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    transition: opacity 1.2s ease;
    z-index: 60;
    pointer-events: none;
  }
  .final-dot.on {
    opacity: .8;
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1);   opacity: .55; }
    50%      { transform: scale(1.9); opacity: 1; }
  }

  /* ---------- ПЕРЕЗАПУСК ---------- */
  .restart {
    position: absolute;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    background: transparent;
    border: 0;
    color: #7a7a7a;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    transition: opacity .9s ease .3s, color .3s ease;
    z-index: 70;
    font-family: inherit;
    padding: 8px 18px;
  }
  .restart.on { opacity: .45; }
  .restart:hover { color: #fff; opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .slot, .portal-ripple, .final-dot { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="ground" id="ground"></div>
  <div class="ball" id="ball"></div>
  <div class="slot" id="slot"></div>

  <div class="key" id="key">
    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
      <path fill-rule="evenodd"
            d="M12,50 A28,28 0 1,0 68,50 A28,28 0 1,0 12,50 Z
               M29,50 A11,11 0 1,1 51,50 A11,11 0 1,1 29,50 Z"/>
      <rect x="45" y="44" width="150" height="12" rx="5"/>
      <rect x="156" y="56" width="11" height="22" rx="3"/>
      <rect x="178" y="56" width="11" height="15" rx="3"/>
    </svg>
  </div>

  <div class="hint" id="hint">Подведите ключ к щели</div>

  <!-- ПОРТАЛ -->
  <div class="portal" id="portal">
    <div class="portal-ripple"></div>
    <div class="portal-ripple"></div>
    <div class="portal-ripple"></div>
    <div class="portal-ripple"></div>
    <div class="portal-core" id="portalCore"></div>
  </div>

  <div class="final-dot" id="finalDot"></div>
  <button class="restart" id="restart" type="button">пройти заново</button>

</div>

<script>
(function () {
  'use strict';

  const stage      = document.getElementById('stage');
  const ballEl     = document.getElementById('ball');
  const groundEl   = document.getElementById('ground');
  const slotEl     = document.getElementById('slot');
  const keyEl      = document.getElementById('key');
  const hintEl     = document.getElementById('hint');
  const portalEl   = document.getElementById('portal');
  const portalCore = document.getElementById('portalCore');
  const finalDot   = document.getElementById('finalDot');
  const restartEl  = document.getElementById('restart');

  /* ---------- Константы ---------- */
  const R             = 18;     // радиус шара
  const FLIP_AT       = 2000;   // мс — инверсия фона
  const FLIP_MS       = 650;    // мс — длительность инверсии
  const ROLL_MS       = 3100;   // мс — общее время качения
  const GRAV          = 2900;   // px/s²
  const SNAP          = 68;     // px — радиус примагничивания
  const LOCK_MS       = 320;    // мс — вставка ключа в щель
  const FALL_LIGHT_MS = 520;    // мс — затемнение во время падения

  /* ---------- Портал ---------- */
  const P_OPEN_MS    = 900;   // мс — раскрытие
  const P_SWALLOW_MS = 1100;  // мс — поглощение экрана
  const P_SETTLE_MS  = 500;   // мс — финальная пауза
  const P_TOTAL_MS   = P_OPEN_MS + P_SWALLOW_MS + P_SETTLE_MS;

  /* ---------- Состояние ---------- */
  let W = 0, H = 0;
  let groundY = 0, startX = 0, edgeX = 0;
  let KW = 0, KH = 0, slotCX = 0, slotCY = 0;

  let phase = 'roll';   // roll → fall → key → portal
  let t0 = 0;
  let light = 0;

  let ballCX = 0, ballCY = 0, ballRot = 0;
  let fallT0 = 0, fallVX = 0, rotAtFall = 0, angVel = 0;

  let keyCX = 0, keyCY = 0, keyScale = 1, keyRot = 0;
  let maxD = 1;
  let dragging = false, dragOffX = 0, dragOffY = 0;
  let locked = false, lockT0 = 0, lockFromX = 0, lockFromY = 0, lockFromLight = 0;

  let hintFade = 0, keyPhaseT0 = 0;

  let portalT0 = 0, portalDone = false;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ================================================================
     РАЗМЕТКА
     ================================================================ */
  function layout() {
    W = stage.clientWidth  || window.innerWidth;
    H = stage.clientHeight || window.innerHeight;

    groundY = Math.round(H * 0.68);
    startX  = -R * 2.5;
    edgeX   = W * 0.76;

    groundEl.style.top   = groundY + 'px';
    groundEl.style.width = edgeX + 'px';

    KW = clamp(W * 0.32, 108, 200);
    KH = KW / 2;
    keyEl.style.width  = KW + 'px';
    keyEl.style.height = KH + 'px';

    slotCX = W / 2;
    slotCY = H / 2;
    slotEl.style.width  = Math.max(64, KW * 0.55) + 'px';
    slotEl.style.height = Math.max(8, KH * 0.14) + 'px';
    slotEl.style.left   = slotCX + 'px';
    slotEl.style.top    = slotCY + 'px';

    if (phase === 'key') clampKey();
  }

  function clampKey() {
    const m = 10;
    keyCX = clamp(keyCX, KW / 2 + m, W - KW / 2 - m);
    keyCY = clamp(keyCY, KH / 2 + m, H - KH / 2 - m);
  }

  /* ================================================================
     ГЛАВНЫЙ ЦИКЛ
     ================================================================ */
  function frame(now) {
    if (!t0) t0 = now;
    const t = now - t0;

    /* ---------- ФАЗА 1: КАТИТСЯ ---------- */
    if (phase === 'roll') {

      if (t < FLIP_AT) {
        light = 0;
      } else {
        light = Math.min(1, (t - FLIP_AT) / FLIP_MS);
      }

      const p = Math.min(1, t / ROLL_MS);
      ballCX  = startX + (edgeX - startX) * p;
      ballCY  = groundY - R;
      ballRot = -((ballCX - startX) / R) * (180 / Math.PI);

      if (t >= ROLL_MS) {
        phase     = 'fall';
        fallT0    = now;
        fallVX    = (edgeX - startX) / ROLL_MS;
        rotAtFall = ballRot;
        angVel    = (fallVX / R) * (180 / Math.PI);
      }
    }

    /* ---------- ФАЗА 2: ПАДЕНИЕ ---------- */
    else if (phase === 'fall') {
      const dt = now - fallT0;
      const s  = dt / 1000;

      ballCX  = edgeX + fallVX * dt;
      ballCY  = (groundY - R) + 0.5 * GRAV * s * s;
      ballRot = rotAtFall - angVel * dt;

      light = Math.max(0, 1 - dt / FALL_LIGHT_MS);

      if (ballCY - R > H + 80) {
        phase = 'key';
        ballEl.style.display = 'none';
        groundEl.classList.add('gone');
        startKeyPhase(now);
      }
    }

    /* ---------- ФАЗА 3: КЛЮЧ ---------- */
    else if (phase === 'key') {

      if (locked) {
        const p = Math.min(1, (now - lockT0) / LOCK_MS);
        const e = 1 - Math.pow(1 - p, 3);

        keyCX    = lockFromX + (slotCX - lockFromX) * e;
        keyCY    = lockFromY + (slotCY - lockFromY) * e;
        keyScale = 1 - 0.18 * e;
        keyRot   = -12 * e;
        light    = lockFromLight + (1 - lockFromLight) * e;

        if (p >= 1) {
          startPortal(now);
        }

      } else {
        const d  = Math.hypot(keyCX - slotCX, keyCY - slotCY);
        const nd = clamp(d / maxD, 0, 1);
        light = Math.pow(1 - nd, 1.25);
      }

      hintFade = Math.min(1, (now - keyPhaseT0) / 900);
    }

    /* ---------- ФАЗА 4: ПОРТАЛ ---------- */
    else if (phase === 'portal') {
      const pt   = now - portalT0;
      const dMax = Math.hypot(W, H) * 2.4;
      let coreD  = 30;
      let keyOp  = 1;
      let slotOp = 0.9;

      if (pt < P_OPEN_MS) {
        /* раскрытие — чёрная дыра растёт, кольца-ряби расходятся */
        const p = pt / P_OPEN_MS;
        const e = p * p * (3 - 2 * p);          // smoothstep
        coreD  = 30 + 150 * e;
        keyOp  = 1 - e;
        slotOp = 0.9 * (1 - e);

      } else if (pt < P_OPEN_MS + P_SWALLOW_MS) {
        /* поглощение — резкий разгон до краёв экрана */
        const p = (pt - P_OPEN_MS) / P_SWALLOW_MS;
        const e = p * p;                        // ease-in (ускорение)
        coreD  = 180 + (dMax - 180) * e;
        keyOp  = 0;
        slotOp = 0;

      } else {
        /* финальная пауза — всё чёрное */
        coreD  = dMax;
        keyOp  = 0;
        slotOp = 0;

        if (!portalDone && pt >= P_TOTAL_MS) {
          portalDone = true;
          finalDot.classList.add('on');
          restartEl.classList.add('on');
        }
      }

      portalCore.style.width  = coreD + 'px';
      portalCore.style.height = coreD + 'px';

      keyEl.style.opacity  = keyOp.toFixed(3);
      slotEl.style.opacity = slotOp.toFixed(3);

      hintEl.style.opacity = '0';

      apply();
      requestAnimationFrame(frame);
      return;
    }

    apply();
    requestAnimationFrame(frame);
  }

  /* ================================================================
     ОТРИСОВКА
     ================================================================ */
  function apply() {
    const bg  = Math.round(light * 255);
    const fg  = 255 - bg;
    const bgc = 'rgb(' + bg + ',' + bg + ',' + bg + ')';
    const fgc = 'rgb(' + fg + ',' + fg + ',' + fg + ')';

    stage.style.background = bgc;
    stage.style.color      = fgc;
    stage.style.setProperty('--bg', bgc);

    ballEl.style.transform =
      'translate(' + (ballCX - R) + 'px,' + (ballCY - R) + 'px) rotate(' + ballRot + 'deg)';

    keyEl.style.transform =
      'translate(' + (keyCX - KW / 2) + 'px,' + (keyCY - KH / 2) + 'px)' +
      ' scale(' + keyScale + ') rotate(' + keyRot + 'deg)';

    hintEl.style.opacity = (0.5 * (1 - light) * hintFade).toFixed(3);
  }

  /* ================================================================
     СТАРТ ФАЗЫ КЛЮЧА
     ================================================================ */
  function startKeyPhase(now) {
    keyPhaseT0 = now;

    keyCX = clamp(W * 0.24, KW / 2 + 14, W - KW / 2 - 14);
    keyCY = clamp(H * 0.78, KH / 2 + 14, H - KH / 2 - 14);

    maxD = Math.hypot(keyCX - slotCX, keyCY - slotCY);
    if (maxD < 1) maxD = 1;

    slotEl.classList.add('show');
    keyEl.classList.add('show');
  }

  /* ================================================================
     СТАРТ ПОРТАЛА
     ================================================================ */
  function startPortal(now) {
    phase    = 'portal';
    portalT0 = now;

    // портал рождается ровно на месте щели
    portalEl.style.left = slotCX + 'px';
    portalEl.style.top  = slotCY + 'px';
    portalEl.classList.add('on');

    // ключ фиксируем ровно в центре, чуть уменьшенным
    keyCX = slotCX;
    keyCY = slotCY;

    apply();
  }

  /* ================================================================
     ПЕРЕТАСКИВАНИЕ
     ================================================================ */
  keyEl.addEventListener('pointerdown', function (e) {
    if (phase !== 'key' || locked) return;
    e.preventDefault();

    dragging = true;
    keyEl.classList.add('dragging');
    try { keyEl.setPointerCapture(e.pointerId); } catch (err) {}

    const r  = stage.getBoundingClientRect();
    dragOffX = (e.clientX - r.left) - keyCX;
    dragOffY = (e.clientY - r.top)  - keyCY;
  });

  keyEl.addEventListener('pointermove', function (e) {
    if (!dragging || locked) return;

    const r  = stage.getBoundingClientRect();
    keyCX = (e.clientX - r.left) - dragOffX;
    keyCY = (e.clientY - r.top)  - dragOffY;
    clampKey();

    const d = Math.hypot(keyCX - slotCX, keyCY - slotCY);
    if (d < SNAP) {
      locked        = true;
      dragging      = false;
      lockT0        = performance.now();
      lockFromX     = keyCX;
      lockFromY     = keyCY;
      lockFromLight = light;

      keyEl.classList.remove('dragging');
      try { keyEl.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  });

  function endDrag() {
    dragging = false;
    keyEl.classList.remove('dragging');
  }

  keyEl.addEventListener('pointerup', endDrag);
  keyEl.addEventListener('pointercancel', endDrag);
  keyEl.addEventListener('lostpointercapture', endDrag);

  /* ================================================================
     ПЕРЕЗАПУСК
     ================================================================ */
  restartEl.addEventListener('click', function () {
    location.reload();
  });

  /* ================================================================
     РЕСАЙЗ
     ================================================================ */
  window.addEventListener('resize', layout);

  /* ================================================================
     СТАРТ
     ================================================================ */
  layout();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
